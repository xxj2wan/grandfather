name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      # Actions 아티팩트는 계정 저장 용량을 쓰므로, Release 첨부 파일로 올린다.
      # 항상 같은 태그(latest-debug)를 덮어써서 다운로드 주소가 바뀌지 않게 한다.
      - name: Publish APK to "latest-debug" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk grandfather.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug grandfather.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "최신 테스트 빌드 #${{ github.run_number }}" \
            --notes "브랜치 ${{ github.ref_name }} / 커밋 ${{ github.sha }}"
